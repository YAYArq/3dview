  document.getElementById('cfgCustomId').value = viewer.config.customId || '';
  document.getElementById('cfgMp3Status').textContent = viewer.config.mp3 ? '已配置' : '未配置';
  document.getElementById('cfgPdf').value = viewer.config.pdf || '';
  document.getElementById('cfgInstanceName').value = viewer.title || '';

  // 打开配置窗时刷新「已上传 MP3 / PDF / 模型」下拉（并高亮当前选中）
  loadMusicList();
  loadPdfList();
  loadModelList();

  // 定位浮层在触发按钮下方
  const r = anchor.getBoundingClientRect();
  configPopover.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 308)) + 'px';
  configPopover.style.top = (r.bottom + 8) + 'px';
  // 若超出底部，翻到按钮上方
  const popH = 460;
  if (r.bottom + 8 + popH > window.innerHeight) {
    configPopover.style.top = Math.max(8, r.top - popH - 8) + 'px';
  }
  configPopover.classList.add('open');
}

function closeConfigPopover() {
  configPopover.classList.remove('open');
  cfgViewer = null;
}

// 控件事件：修改后即时生效到对应 viewer
document.getElementById('cfgRotate').addEventListener('change', (e) => {
  if (cfgViewer) { cfgViewer.config.autoRotate = e.target.checked; cfgViewer.applyConfig(); _saveWindows(); }
});
document.getElementById('cfgRotateSpeed').addEventListener('input', (e) => {
  if (cfgViewer) {
    cfgViewer.config.rotateSpeed = parseFloat(e.target.value);
    document.getElementById('cfgRotateSpeedVal').textContent = cfgViewer.config.rotateSpeed.toFixed(1) + 'x';
    cfgViewer.applyConfig();
    _saveWindows();
  }
});
document.getElementById('cfgAnim').addEventListener('change', (e) => {
  if (cfgViewer) { cfgViewer.config.playAnimation = e.target.checked; cfgViewer.applyConfig(); _saveWindows(); }
});
document.getElementById('cfgAnimSpeed').addEventListener('input', (e) => {
  if (cfgViewer) {
    cfgViewer.config.animSpeed = parseFloat(e.target.value);
    document.getElementById('cfgAnimSpeedVal').textContent = cfgViewer.config.animSpeed.toFixed(1) + 'x';
    cfgViewer.applyConfig();
    _saveWindows();
  }
});
document.getElementById('cfgColors').addEventListener('click', (e) => {
  const dot = e.target.closest('.cfg-color');
  if (!dot || !cfgViewer) return;
  cfgViewer.config.background = dot.dataset.color;
  document.querySelectorAll('#cfgColors .cfg-color').forEach((d) => {
    d.classList.toggle('active', d === dot);
  });
  cfgViewer.applyConfig();
  _saveWindows();
});

// 展示文本：实时更新到模型下方，并保存
document.getElementById('cfgText').addEventListener('input', (e) => {
  if (cfgViewer) {
    cfgViewer.config.text = e.target.value;
    cfgViewer.applyConfig();
    _saveWindows();
  }
});

// 独立链接自定义 ID
document.getElementById('cfgCustomId').addEventListener('input', (e) => {
  if (!cfgViewer) return;
  const v = e.target.value.trim();
  // 仅允许字母/数字，1-32 位
  if (v && !/^[A-Za-z0-9]{1,32}$/.test(v)) {
    e.target.value = cfgViewer.config.customId || '';
    showToast('ID 仅含字母或数字，1-32 位');
    return;
  }
  cfgViewer.config.customId = v;
  _saveWindows();
});

// 背景音乐地址
document.getElementById('cfgMp3').addEventListener('input', (e) => {
  if (cfgViewer) {
    cfgViewer.config.mp3 = e.target.value.trim();
    cfgViewer.applyConfig();
    document.getElementById('cfgMp3Status').textContent = cfgViewer.config.mp3 ? '已配置' : '未配置';
    _saveWindows();
  }
});

// 试听 / 停止
document.getElementById('cfgMp3Play').addEventListener('click', () => {
  if (!cfgViewer) return;
  if (cfgViewer.audioPlaying) {
    cfgViewer.pauseAudio();
    document.getElementById('cfgMp3Play').textContent = '试听 / 停止';
  } else {
    cfgViewer.playAudio();
    document.getElementById('cfgMp3Play').textContent = cfgViewer.audioPlaying ? '停止' : '试听 / 停止';
  }
});

/* ================================================================
 *  工具函数
 * ================================================================ */

// 从 URL 中提取文件名作为默认标题
function _extractFileName(url) {
  try {
    const pathname = new URL(url, window.location.href).pathname;
    const name = pathname.substring(pathname.lastIndexOf('/') + 1);
    return decodeURIComponent(name) || '自定义模型';
  } catch (e) {
    return '自定义模型';
  }
}

// 轻量 toast 提示
let _toastTimer = null;
function showToast(msg) {
  let t = document.querySelector('.toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// 复制文本到剪贴板（优先 Clipboard API，失败时降级为 execCommand）
function _copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('已复制独立链接'),
      () => _fallbackCopy(text)
    );
  } else {
    _fallbackCopy(text);
  }
}
function _fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制独立链接');
  } catch (e) {
    showToast('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}

/* ================================================================
 *  本地持久化（localStorage）：添加的模型与各窗口配置刷新后保留
 * ================================================================ */
const STORAGE_KEY = 'm3d_viewer_windows_v1';

// 把当前所有窗口保存到 localStorage
function _saveWindows() {
  const data = viewers
    .map((v) => ({
      url: v.url || '',
      title: v.title || '',
      desc: v.desc || '',
      shortId: v.shortId || '',
      config: {
        autoRotate: v.config.autoRotate,
        rotateSpeed: v.config.rotateSpeed,
        playAnimation: v.config.playAnimation,
        animSpeed: v.config.animSpeed,
        background: v.config.background,
        text: v.config.text || '',
        mp3: v.config.mp3 || '',
        volume: v.config.volume,
        customId: (typeof v.config.customId === 'string' ? v.config.customId : '').trim(),
        pdf: v.config.pdf || ''
      }
    }));
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('保存窗口配置失败', e);
  }
}

// 读取保存的窗口配置：无保存返回 null；保存过（含空数组=已清空）返回数组
function _loadWindows() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) return null; // 从未保存过
    const data = JSON.parse(raw);
    if (Array.isArray(data)) {
      return data.map((w) => ({
        url: w.url,
        title: w.title,
        desc: w.desc,
        config: Object.assign({
          autoRotate: false, rotateSpeed: 1, playAnimation: true,
          animSpeed: 1, background: '#e8eaed', text: '', mp3: '', volume: 1, customId: '', pdf: ''
        }, w.config || {})
      }));
    }
  } catch (e) { /* 解析失败则当作无保存 */ }
  return null;
}

// 空状态提示
let emptyEl = null;
function _updateEmptyState() {
  if (viewers.length === 0) {
    if (!emptyEl) {
      emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state';
      emptyEl.innerHTML = '<p>暂无模型窗口，可点击「上传本地模型」选择 .glb / .gltf / .obj / .fbx 文件，或在上方输入模型地址后点击「添加模型」</p>';
      grid.appendChild(emptyEl);
    }
  } else {
    if (emptyEl && emptyEl.parentNode) {
      emptyEl.parentNode.removeChild(emptyEl);
      emptyEl = null;
    }
  }
}

/* ================================================================
 *  初始化：内置 4 个示例模型
 *  模型来源：Three.js 官方仓库示例模型（jsDelivr CDN 代理，支持 CORS）
 * ================================================================ */
const demoModels = [
  {
    title: '火烈鸟 Flamingo',
    url: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r147/examples/models/gltf/Flamingo.glb',
    desc: '挥翅飞行的火烈鸟，自带飞行动画，加载后自动循环播放。'
  },
  {
    title: '骏马 Horse',
    url: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r147/examples/models/gltf/Horse.glb',
    desc: '奔跑中的骏马，自带奔跑动画，加载后自动循环播放，可观察骨骼蒙皮效果。'
  },
  {
    title: '鹦鹉 Parrot',
    url: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r147/examples/models/gltf/Parrot.glb',
    desc: '扑翅的鹦鹉，自带动画，加载后自动循环播放。'
  },
  {
    title: '鹳 Stork',
    url: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r147/examples/models/gltf/Stork.glb',
    desc: '展翅滑翔的鹳，自带飞行姿态动画，加载后自动循环播放。'
  }
];

/* ================================================================
 *  初始化：解析 URL 参数
 *  - 带 ?url= 参数 → 单模型模式（独立链接 / 全景热点嵌入）
 *  - 无参数        → 多窗口模式（4 个内置示例 + 控制面板）
 * ================================================================ */
const queryParams = new URLSearchParams(location.search);
const queryUrl = queryParams.get('url');
const queryId = queryParams.get('id');

/* 构造单模型（全景热点纯净展示）viewer，并应用配置 */
function buildStandaloneViewer(url, cfg) {
  const v = new ModelViewer({
    title: (cfg && cfg.title) || _extractFileName(url),
    url,
    desc: url,
    standalone: true
  });
  if (cfg) {
    if (cfg.autoRotate) v.config.autoRotate = true;
    if (cfg.rotateSpeed) v.config.rotateSpeed = parseFloat(cfg.rotateSpeed) || 1;
    if (cfg.playAnimation === false) v.config.playAnimation = false;
    if (cfg.animSpeed) v.config.animSpeed = parseFloat(cfg.animSpeed) || 1;
    if (cfg.background) v.config.background = cfg.background;
    if (cfg.text) v.config.text = cfg.text;
    if (cfg.mp3) v.config.mp3 = cfg.mp3;
    if (cfg.volume) v.config.volume = cfg.volume;
    if (cfg.pdf) v.config.pdf = cfg.pdf;
  } else {
    // 兼容旧的 ?url=&text=&mp3= 全参数版链接
    if (queryParams.get('autoRotate') === '1' || queryParams.get('rotate') === '1') v.config.autoRotate = true;
    if (queryParams.get('rotateSpeed')) v.config.rotateSpeed = parseFloat(queryParams.get('rotateSpeed')) || 1;
    if (queryParams.get('anim') === '0') v.config.playAnimation = false;
    if (queryParams.get('animSpeed')) v.config.animSpeed = parseFloat(queryParams.get('animSpeed')) || 1;
    if (queryParams.get('bg')) v.config.background = '#' + queryParams.get('bg');
    if (queryParams.get('text')) v.config.text = queryParams.get('text');
    if (queryParams.get('mp3')) v.config.mp3 = queryParams.get('mp3');
  }
  v.applyConfig();
  // 独立短链页：默认折叠展示文本（点击底部文本按钮可展开）
  if (v.standalone && v.textEl) v.textEl.classList.add('collapsed');
  viewers.push(v);
  _updateEmptyState();
  // 独立短链页：配置了 MP3 时自动播放。
  // 浏览器会拦截“无用户交互”的自动播放，因此同时监听页面首次交互（点击/触摸/按键），
  // 一旦用户点了页面任意位置就自动开声，避免还要专门去找播放按钮。
  if (v.standalone && v.config.mp3) {
    // 封面：先尝试 muted 自动起播；若被浏览器拦截，显示“点击开始播放”浮层，点击即可出声并消失
    const cover = _createPlayCover(v);
    setTimeout(() => {
      v.playAudioAuto();
      // mute 起播成功则自动移除封面，让音乐直接播放
      setTimeout(() => { if (v.audioPlaying) cover.remove(); }, 800);
    }, 400);
    // 兜底：首次交互仍未播放时再触发一次
    const onFirstInteraction = (ev) => {
      if (!v.audioPlaying) v.playAudioAuto();
      document.removeEventListener('pointerdown', onFirstInteraction);
      document.removeEventListener('touchstart', onFirstInteraction);
      document.removeEventListener('keydown', onFirstInteraction);
      if (v.audioPlaying) cover.remove();
    };
    document.addEventListener('pointerdown', onFirstInteraction, { passive: true });
    document.addEventListener('touchstart', onFirstInteraction, { passive: true });
    document.addEventListener('keydown', onFirstInteraction);
  }
  return v;
}

/* 独立短链页的“点击开始播放”封面（浏览器自动播放被拦截时的可用入口） */
function _createPlayCover(viewer) {
  const cover = document.createElement('div');
  cover.className = 'play-cover';
  cover.innerHTML =
    '<div class="play-cover-inner">' +
      '<div class="play-cover-btn">▶</div>' +
      '<div class="play-cover-text">点击开始播放</div>' +
    '</div>';
  document.body.appendChild(cover);
  cover.addEventListener('click', (ev) => {
    ev.stopPropagation();
    viewer.playAudio();
    cover.remove();
  });
  return cover;
}

if (queryId) {
  // ---- 短链模式：从服务器读取配置，模型地址/文本等不会撑长 URL ----
  (async () => {
    try {
      const resp = await fetch('/config/' + encodeURIComponent(queryId), { method: 'GET' });
      let data = {};
      try { data = await resp.json(); } catch (e) {}
      if (!resp.ok || !data.ok || !data.config || !data.config.url) {
        throw new Error((data && data.error) || '短链无效或已失效');
      }
      const v = buildStandaloneViewer(data.config.url, data.config);
      // 兜底：服务器短链 config 可能因历史原因缺 pdf，从本地 localStorage 匹配该窗口配置的 PDF
      if (v && data.config && !data.config.pdf) {
        try {
          const saved = _loadWindows();
          if (Array.isArray(saved)) {
            const w = saved.find((x) => x.shortId === queryId);
            if (w && w.config && w.config.pdf) {
              v.config.pdf = _finalizeModelUrl(w.config.pdf);
            }
          }
        } catch (e) { console.warn('恢复本地 PDF 失败', e); }
      }
    } catch (err) {
      console.error('读取短链配置失败', err);
      showToast('读取链接配置失败：' + err.message);
    }
  })();
} else if (queryUrl) {
  // ---- 单模型模式（旧链接或未用短链） ----
  const title = queryParams.get('title') || _extractFileName(queryUrl);
  const viewer = new ModelViewer({
    title,
    url: queryUrl,
    desc: queryUrl,
    standalone: true
  });
  // 应用 URL 携带的配置（全景热点可自定义每个热点的展示）
  if (queryParams.get('autoRotate') === '1' || queryParams.get('rotate') === '1') {
    viewer.config.autoRotate = true;
  }
  if (queryParams.get('rotateSpeed')) {
    viewer.config.rotateSpeed = parseFloat(queryParams.get('rotateSpeed')) || 1;
  }
  if (queryParams.get('anim') === '0') {
    viewer.config.playAnimation = false;
  }
  if (queryParams.get('animSpeed')) {
    viewer.config.animSpeed = parseFloat(queryParams.get('animSpeed')) || 1;
  }
  if (queryParams.get('bg')) {
    viewer.config.background = '#' + queryParams.get('bg');
  }
  if (queryParams.get('text')) {
    viewer.config.text = queryParams.get('text');
  }
  if (queryParams.get('mp3')) {
    viewer.config.mp3 = queryParams.get('mp3');
  }
  viewer.applyConfig();
  viewers.push(viewer);
  _updateEmptyState();

} else {
  // ---- 多窗口模式：优先恢复本地保存的窗口配置，否则创建 4 个内置示例 ----
  const saved = _loadWindows();
  if (saved !== null) {
    // 有保存记录（可能为空数组 = 用户已清空，保持为空）
    saved.forEach((w) => {
      const viewer = new ModelViewer({ title: w.title, url: w.url || '', desc: w.desc, config: w.config });
      viewer.shortId = w.shortId || ''; // 恢复历史短链 ID，保证刷新后链接仍稳定
      viewers.push(viewer);
    });
  } else {
    // 从未保存过：创建 4 个内置示例
    demoModels.forEach((m) => {
      const viewer = new ModelViewer({ title: m.title, url: m.url, desc: m.desc });
      viewers.push(viewer);
    });
  }
  // 保存当前窗口（首次为默认 4 个，之后为用户已保存的配置）
  _saveWindows();
  _updateEmptyState();
}

loadMusicList();
</script>
