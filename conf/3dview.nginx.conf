# =========================================================
# 3D模型全景热点展示系统 - Nginx 站点配置
# 对外端口：10280（请按实际情况修改 HTTP_SERVER_PORT）
# 上传/列表/短链接口反向代理到内网上传服务 127.0.0.1:10281
# 使用方式：放到 /etc/nginx/sites-available/ 并软链到
#           /etc/nginx/sites-enabled/ 后 nginx -s reload
# =========================================================
server {
    listen 10280;
    server_name _;
    root /var/www/3dview;
    index index.html;

    # 允许大文件上传（GLB/GLTF 模型，可到数百 MB，这里是 300MB）
    client_max_body_size 300m;

    # 上传接口：反向代理到内网上传服务
    location /upload {
        proxy_pass http://127.0.0.1:10281;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 文件列表接口（列出已上传的 models / music 文件，用于前端下拉选择）
    location /list {
        proxy_pass http://127.0.0.1:10281;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 短链配置接口（保存/读取独立链接的服务器端配置）
    location /config {
        proxy_pass http://127.0.0.1:10281;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 模型 / 音频静态文件，开放跨域（模型与音乐从 CDN/全景端访问需要）
    location ~* \.(glb|gltf|bin|png|jpg|jpeg|webp|mp3|pdf)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range' always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
